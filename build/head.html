<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>春知星图</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
:root{
  /* layout: full-bleed star chart on a canvas; floating panels — list and filters left, paper detail right */
  --night:#0B2F37;
  --ink:#113F49;
  --line:#356874;
  --ivory:#EEF7F6;
  --mute:#B9D3D6;
  --cyan:#9FF2EA;
  --font-display:'Noto Serif SC','Songti SC','SimSun',serif;
  --font-body:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--ivory);font-family:var(--font-body);font-size:14px;overflow:hidden}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#sky{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#sky.drag{cursor:grabbing}
#sky.hit{cursor:pointer}
.top{position:fixed;left:16px;right:16px;top:14px;z-index:3;display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;pointer-events:none}
.top>*{pointer-events:auto}
.brand{display:flex;flex-direction:column;gap:2px;margin-right:6px}
.brand h1{margin:0;font-family:var(--font-display);font-size:24px;font-weight:700;letter-spacing:6px;color:#FFFFFF}
.brand .c1{color:var(--cyan)}
.brand .c2{color:#FFFFFF}
.brand .c3{color:#B9D2D4}
.brand p{margin:0;font-size:12px;color:var(--mute);letter-spacing:1px}
.search{display:flex;align-items:center;gap:8px;flex:0 1 420px;min-width:220px}
.search input{flex:1;min-width:0;height:44px;padding:0 18px;border-radius:22px;border:1px solid var(--line);background:rgba(15,56,65,.8);font-size:14px}
.search input::placeholder{color:var(--mute)}
.pill{min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:rgba(15,56,65,.8);font-size:13px;white-space:nowrap}
.pill[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan)}
#count{font-size:12px;color:var(--mute);white-space:nowrap}
.panel{position:fixed;z-index:2;background:rgba(15,56,65,.8);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:16px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.left{left:16px;top:84px;bottom:16px;width:320px}
.right{right:16px;top:84px;bottom:16px;width:360px}
.left[hidden]{display:none}
@media (min-width:861px){.right.empty{bottom:auto}}
.right .close{position:absolute;top:8px;right:8px;width:40px;height:40px;border-radius:20px;border:0;background:transparent;font-size:20px;line-height:1;color:var(--mute)}
.right .close:hover{color:var(--ivory)}
.right .meta{padding-right:40px}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.panel h2{margin:0;font-family:var(--font-display);font-size:19px;line-height:1.5;font-weight:700;text-wrap:balance}
.panel h3{margin:0;font-size:12px;font-weight:500;color:var(--mute);letter-spacing:1px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:12px;color:var(--mute)}
.dot{flex:none;width:9px;height:9px;border-radius:50%;display:inline-block}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats div{padding:10px;border-radius:10px;background:rgba(7,34,41,.6);display:flex;flex-direction:column;gap:2px}
.stats b{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--mute)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.tag{min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:rgba(7,34,41,.6);font-size:13px;display:inline-flex;align-items:center;gap:6px}
.tag[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan)}
.tag small{color:var(--mute);font-size:12px}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.btn{min-height:44px;border-radius:10px;border:1px solid var(--cyan);background:rgba(142,230,222,.14);color:var(--cyan);font-size:14px;display:flex;align-items:center;justify-content:center;text-decoration:none}
.btn.ghost{border-color:var(--line);background:transparent;color:var(--ivory)}
.items{display:flex;flex-direction:column;gap:6px}
.item{min-height:44px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:rgba(7,34,41,.6);text-align:left;display:flex;gap:10px;align-items:flex-start}
.item:hover{border-color:#5A97A3}
.item.on{border-color:var(--cyan)}
.item .dot{margin-top:6px}
.item span.t{display:block;font-size:13px;line-height:1.45}
.item span.s{display:block;font-size:12px;line-height:1.45;color:var(--mute)}
.note{font-size:12px;color:var(--mute);line-height:1.6;margin:0}
.lead{font-family:var(--font-display);font-size:15px;line-height:1.9;margin:0;color:var(--ivory)}
.modes{position:fixed;z-index:2;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:10px;align-items:center}
.seg{display:flex;gap:4px;padding:4px;border-radius:26px;border:1px solid var(--line);background:rgba(15,56,65,.8)}
.seg button{min-height:40px;padding:0 18px;border-radius:20px;border:0;background:transparent;font-size:13px}
.seg button[aria-pressed="true"]{background:rgba(142,230,222,.16);color:var(--cyan)}
.seg button.sq{padding:0;width:40px;font-size:18px}
.tip{position:fixed;z-index:4;max-width:280px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:rgba(7,34,41,.95);font-size:12px;line-height:1.5;pointer-events:none}
.tip b{display:block;font-size:13px;font-weight:500}
.tip span{color:var(--mute)}
.tip[hidden]{display:none}
@media (max-width:860px){
  .brand p{display:none}
  .right{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:40%}
  .left{left:8px;right:8px;top:124px;bottom:auto;width:auto;max-height:46%}
}
</style>
</head>
<body>
<canvas id="sky" role="img" aria-label="文献星图：每颗星是一篇文献。也可以用检索框和文献列表选择文献。"></canvas>

<header class="top">
  <div class="brand">
    <h1><span class="c1">春</span><span class="c2">知</span><span class="c3">星图</span></h1>
    <p>纯稚学文献关联网络</p>
  </div>
  <div class="search">
    <input id="q" type="search" placeholder="检索标题、作者、理论、学科" aria-label="检索文献" autocomplete="off">
  </div>
  <button type="button" class="pill" id="listBtn" data-act="list" aria-pressed="false">列表与筛选</button>
  <span id="count"></span>
</header>

<aside class="panel left" id="left" aria-label="文献列表与筛选" hidden></aside>
<aside class="panel right" id="right" aria-label="当前文献"></aside>

<div class="modes">
  <div class="seg" role="group" aria-label="视图">
    <button type="button" data-act="mode" data-m="sky" id="mSky" aria-pressed="true">星空总览</button>
    <button type="button" data-act="mode" data-m="focus" id="mFocus" aria-pressed="false">关联图</button>
  </div>
  <div class="seg" role="group" aria-label="缩放">
    <button type="button" class="sq" data-act="zoom" data-z="in" aria-label="放大">+</button>
    <button type="button" class="sq" data-act="zoom" data-z="out" aria-label="缩小">−</button>
    <button type="button" data-act="zoom" data-z="fit">全景</button>
  </div>
</div>

<div class="tip" id="tip" hidden></div>

var DC = ['#8FC2FF', '#FFC98A', '#C8B4FF', '#FFA3C0', '#FFE3B0', '#FF9E90', '#E0C4A0', '#F5EC98', '#7FE8D2', '#9BE8FF', '#C2F5A0', '#8FE3A8', '#B4C2FF', '#E8B0F2', '#FFFFFF', '#9DB7BC'];
var RAW = `
